default_provider = "deepseek_local"

[providers.deepseek_local]
kind = "openai_compatible"
base_url = "http://127.0.0.1:8000/v1"
model = "deepseek-v4-flash"
api_key_env = ""
external = false
max_output_tokens = 393216
context_window_tokens = 393216

[providers.openai]
kind = "openai_compatible"
base_url = "https://api.openai.com/v1"
model = "gpt-5.2"
api_key_env = "OPENAI_API_KEY"
external = true
max_output_tokens = 8192
[providers.zai]
kind = "openai_compatible"
base_url = "https://api.z.ai/api/paas/v4"
model = "glm-5.2"
api_key_env = "ZAI_API_KEY"
external = true
max_output_tokens = 8192

[providers.codex_oneshot]
kind = "codex_oneshot"
base_url = "https://chatgpt.com/codex-cli"
model = "gpt-5.6-sol"
api_key_env = ""
external = true
max_output_tokens = 131072
context_window_tokens = 524288

[providers.claude_oneshot]
kind = "claude_oneshot"
base_url = "https://api.anthropic.com/claude-code"
model = "opus"
api_key_env = ""
external = true
max_output_tokens = 131072
context_window_tokens = 200000

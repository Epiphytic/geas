name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install development environment
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Skill lifecycle end to end
        run: uv run pytest tests/test_skill_end_to_end.py -v

      - name: Full test suite
        run: uv run pytest -q

      - name: Offline repository subscription integration
        run: uv run pytest tests/test_repository_subscription_end_to_end.py -v

      - name: Check formatting-only diff errors
        run: git diff --check

      - name: Build wheel
        run: uv build --wheel

      - name: Inspect packaged generic skill
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = sorted(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          with ZipFile(wheels[0]) as wheel:
              names = set(wheel.namelist())
          required = {
              "research_agent/builtin_skills/geas/SKILL.md",
              "research_agent/builtin_skills/geas/references/cli.md",
              "research_agent/builtin_skills/geas/references/security.md",
              "research_agent/builtin_skills/geas/references/skills.md",
          }
          missing = sorted(required - names)
          assert not missing, missing
          PY

      - name: Maintained offline demo
        run: |
          demo_root=$(mktemp -d /tmp/geas-ci-demo.XXXXXX)
          ./ontology/open-source-research-agents/demo.sh "$demo_root"

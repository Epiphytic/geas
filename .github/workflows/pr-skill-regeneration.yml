name: PR Skill Regeneration

on:
  pull_request:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact pull-request head without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          enable-cache: true

      - name: Install the checked-out development environment
        run: |
          set -euo pipefail
          uv sync --extra dev

      - name: Generate and independently verify the exact skill snapshots
        env:
          GEAS_SOURCE_REPOSITORY: ${{ github.repository }}
          GEAS_SOURCE_REPOSITORY_ID: ${{ github.repository_id }}
          GEAS_SOURCE_RUN_ID: ${{ github.run_id }}
          GEAS_PULL_REQUEST: ${{ github.event.pull_request.number }}
          GEAS_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          GEAS_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GEAS_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          UV_NO_SYNC: "1"
          UV_OFFLINE: "1"
        run: |
          set -euo pipefail
          uv run python -m research_agent.pr_skill_sync generate \
            --repository . \
            --artifact pr-skill-artifact

      - name: Upload the manifest-bound snapshot artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: geas-pr-skills
          path: pr-skill-artifact
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

name: PR Skill Writeback

on:
  workflow_run:
    workflows:
      - PR Skill Regeneration
    types:
      - completed

permissions:
  actions: read
  contents: read
  id-token: write
  pull-requests: read

jobs:
  writeback:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out protected trusted code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/heads/main
          path: trusted
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          enable-cache: true

      - name: Install only protected trusted code
        working-directory: trusted
        run: |
          set -euo pipefail
          uv sync

      - name: Validate the originating workflow before artifact access
        id: event
        working-directory: trusted
        run: |
          set -euo pipefail
          uv run python -m research_agent.pr_skill_sync evaluate-event \
            --event "$GITHUB_EVENT_PATH" \
            --context event-context.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Download only the fixed artifact from the validated run
        if: steps.event.outputs.writeback == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: geas-pr-skills
          path: pr-skill-artifact
          run-id: ${{ steps.event.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Query the pull request before its initial file inventory
        if: steps.event.outputs.writeback == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GEAS_PULL_REQUEST: ${{ steps.event.outputs.pull_request }}
        run: |
          set -euo pipefail
          gh api "repos/Epiphytic/geas/pulls/${GEAS_PULL_REQUEST}" > trusted/pull-request.json

      - name: Query the complete pull-request file inventory
        if: steps.event.outputs.writeback == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GEAS_PULL_REQUEST: ${{ steps.event.outputs.pull_request }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            "repos/Epiphytic/geas/pulls/${GEAS_PULL_REQUEST}/files?per_page=100" \
            > trusted/pull-request-files.json

      - name: Re-query the pull request after its initial file inventory
        if: steps.event.outputs.writeback == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GEAS_PULL_REQUEST: ${{ steps.event.outputs.pull_request }}
        run: |
          set -euo pipefail
          gh api "repos/Epiphytic/geas/pulls/${GEAS_PULL_REQUEST}" > trusted/pull-request-after-files.json

      - name: Check out the untrusted head as inert comparison bytes
        if: steps.event.outputs.writeback == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.event.outputs.head_sha }}
          fetch-depth: 0
          path: pr-source
          persist-credentials: false

      - name: Bind the initial file inventory to the exact head
        if: steps.event.outputs.writeback == 'true'
        working-directory: trusted
        run: |
          set -euo pipefail
          uv run python -m research_agent.pr_skill_sync bind-files \
            --context event-context.json \
            --before pull-request.json \
            --after pull-request-after-files.json \
            --files pull-request-files.json \
            --output pull-request-files-bound.json \
            --repository ../pr-source

      - name: Verify artifact bytes, metadata, head, and changed state
        if: steps.event.outputs.writeback == 'true'
        id: verify
        working-directory: trusted
        run: |
          set -euo pipefail
          uv run python -m research_agent.pr_skill_sync verify \
            --artifact ../pr-skill-artifact \
            --context event-context.json \
            --pull-request pull-request.json \
            --pull-request-files pull-request-files-bound.json \
            --repository ../pr-source \
            --github-output "$GITHUB_OUTPUT"

      - name: Re-query the pull request before the fresh pre-token inventory
        if: steps.verify.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GEAS_PULL_REQUEST: ${{ steps.event.outputs.pull_request }}
        run: |
          set -euo pipefail
          gh api "repos/Epiphytic/geas/pulls/${GEAS_PULL_REQUEST}" > trusted/pull-request-current.json

      - name: Re-query the complete file inventory immediately before token exchange
        if: steps.verify.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GEAS_PULL_REQUEST: ${{ steps.event.outputs.pull_request }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            "repos/Epiphytic/geas/pulls/${GEAS_PULL_REQUEST}/files?per_page=100" \
            > trusted/pull-request-files-current.json

      - name: Re-query the pull request after the fresh pre-token inventory
        if: steps.verify.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GEAS_PULL_REQUEST: ${{ steps.event.outputs.pull_request }}
        run: |
          set -euo pipefail
          gh api "repos/Epiphytic/geas/pulls/${GEAS_PULL_REQUEST}" > trusted/pull-request-current-after-files.json

      - name: Bind the fresh pre-token inventory to the exact head
        if: steps.verify.outputs.changed == 'true'
        working-directory: trusted
        run: |
          set -euo pipefail
          uv run python -m research_agent.pr_skill_sync bind-files \
            --context event-context.json \
            --before pull-request-current.json \
            --after pull-request-current-after-files.json \
            --files pull-request-files-current.json \
            --output pull-request-files-current-bound.json \
            --repository ../pr-source

      - name: Re-verify the exact head and fresh inventory before token exchange
        if: steps.verify.outputs.changed == 'true'
        id: reverify
        working-directory: trusted
        run: |
          set -euo pipefail
          uv run python -m research_agent.pr_skill_sync verify \
            --artifact ../pr-skill-artifact \
            --context event-context.json \
            --pull-request pull-request-current.json \
            --pull-request-files pull-request-files-current-bound.json \
            --repository ../pr-source \
            --github-output "$GITHUB_OUTPUT"

      - name: Fetch and validate the exact protected Octo STS policy
        if: steps.reverify.outputs.changed == 'true'
        working-directory: trusted
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            "repos/Epiphytic/.github/contents/.github/chainguard/geas-pr-skill-sync.sts.yaml?ref=main" \
            --jq .content | base64 --decode > geas-pr-skill-sync.sts.yaml
          uv run python -m research_agent.pr_skill_sync validate-policy \
            geas-pr-skill-sync.sts.yaml

      - name: Exchange OIDC for a short-lived path-scoped write token
        if: steps.reverify.outputs.changed == 'true'
        id: sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05
        with:
          domain: sts.epiphytic.org
          scope: Epiphytic/.github
          identity: geas-pr-skill-sync

      - name: Check out the still-expected head with the short-lived token
        if: steps.reverify.outputs.changed == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.event.outputs.head_sha }}
          fetch-depth: 0
          path: writeback
          token: ${{ steps.sts.outputs.token }}

      - name: Copy exact bytes, stage exact roots, and push with an exact lease
        if: steps.reverify.outputs.changed == 'true'
        id: writeback
        working-directory: trusted
        run: |
          set -euo pipefail
          uv run python -m research_agent.pr_skill_sync writeback \
            --artifact ../pr-skill-artifact \
            --context event-context.json \
            --pull-request pull-request-current.json \
            --repository ../writeback \
            --github-output "$GITHUB_OUTPUT"

      - name: Query the App-authored head and complete inventory before approval
        if: steps.writeback.outputs.pushed == 'true'
        working-directory: trusted
        env:
          GH_TOKEN: ${{ github.token }}
          GEAS_PULL_REQUEST: ${{ steps.event.outputs.pull_request }}
          GEAS_EXPECTED_HEAD: ${{ steps.writeback.outputs.commit }}
        run: |
          set -euo pipefail
          gh api "repos/Epiphytic/geas/pulls/${GEAS_PULL_REQUEST}" \
            > pull-request-after-writeback.json
          gh api --paginate --slurp \
            "repos/Epiphytic/geas/pulls/${GEAS_PULL_REQUEST}/files?per_page=100" \
            > pull-request-files-after-writeback.json
          gh api "repos/Epiphytic/geas/pulls/${GEAS_PULL_REQUEST}" \
            > pull-request-after-writeback-files.json
          uv run python -m research_agent.pr_skill_sync bind-files \
            --context event-context.json \
            --before pull-request-after-writeback.json \
            --after pull-request-after-writeback-files.json \
            --files pull-request-files-after-writeback.json \
            --output pull-request-files-after-writeback-bound.json \
            --repository ../writeback \
            --expected-head "$GEAS_EXPECTED_HEAD"

      - name: Approve with the distinct App identity
        if: steps.writeback.outputs.pushed == 'true'
        working-directory: trusted
        env:
          GH_TOKEN: ${{ steps.sts.outputs.token }}
          GEAS_PULL_REQUEST: ${{ steps.event.outputs.pull_request }}
          GEAS_EXPECTED_HEAD: ${{ steps.writeback.outputs.commit }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/Epiphytic/geas/pulls/${GEAS_PULL_REQUEST}/reviews" \
            -f event=APPROVE \
            -f commit_id="$GEAS_EXPECTED_HEAD" \
            > pull-request-review.json

      - name: Verify GitHub recorded approval on the exact commit
        if: steps.writeback.outputs.pushed == 'true'
        working-directory: trusted
        env:
          GEAS_EXPECTED_HEAD: ${{ steps.writeback.outputs.commit }}
        run: |
          set -euo pipefail
          uv run python -m research_agent.pr_skill_sync verify-review \
            --context event-context.json \
            --review pull-request-review.json \
            --expected-head "$GEAS_EXPECTED_HEAD"

      - name: Re-query and verify the exact head before auto-merge
        if: steps.writeback.outputs.pushed == 'true'
        working-directory: trusted
        env:
          GH_TOKEN: ${{ github.token }}
          GEAS_PULL_REQUEST: ${{ steps.event.outputs.pull_request }}
          GEAS_EXPECTED_HEAD: ${{ steps.writeback.outputs.commit }}
        run: |
          set -euo pipefail
          gh api "repos/Epiphytic/geas/pulls/${GEAS_PULL_REQUEST}" > pull-request-before-merge.json
          uv run python -m research_agent.pr_skill_sync verify-head \
            --context event-context.json \
            --pull-request pull-request-before-merge.json \
            --expected-head "$GEAS_EXPECTED_HEAD"

      - name: Enable ruleset-gated squash auto-merge
        if: steps.writeback.outputs.pushed == 'true'
        working-directory: trusted
        env:
          GH_TOKEN: ${{ steps.sts.outputs.token }}
          GEAS_PULL_REQUEST: ${{ steps.event.outputs.pull_request }}
          GEAS_EXPECTED_HEAD: ${{ steps.writeback.outputs.commit }}
        run: |
          set -euo pipefail
          gh pr merge "$GEAS_PULL_REQUEST" \
            --repo Epiphytic/geas \
            --squash \
            --auto \
            --match-head-commit "$GEAS_EXPECTED_HEAD"

concepts:
  - id: concept:open-source-research-agents
    label: Open-source research agents
    description: Open-source systems that plan, retrieve, synthesize, or maintain research knowledge.
    synonyms: [open deep research, research automation]
    recorded_at: 2026-08-03T16:00:00Z
    recorded_by: operator:epiphytic
  - id: concept:report-first-research
    label: Report-first research
    description: Research workflows whose main durable output is a generated report or answer.
    broader: [concept:open-source-research-agents]
    recorded_at: 2026-08-03T16:00:00Z
    recorded_by: operator:epiphytic
  - id: concept:persistent-research-knowledge
    label: Persistent research knowledge
    description: Research workflows that preserve reusable structured knowledge beyond one report.
    broader: [concept:open-source-research-agents]
    synonyms: [persistent ontology, research knowledge graph]
    recorded_at: 2026-08-03T16:00:00Z
    recorded_by: operator:epiphytic
  - id: concept:scientific-literature-agents
    label: Scientific literature agents
    description: Research systems specialized for scholarly documents and scientific metadata.
    broader: [concept:open-source-research-agents]
    recorded_at: 2026-08-03T16:00:00Z
    recorded_by: operator:epiphytic
  - id: concept:multi-agent-research
    label: Multi-agent research
    description: Research workflows coordinated across multiple specialized agents.
    broader: [concept:open-source-research-agents]
    recorded_at: 2026-08-03T16:00:00Z
    recorded_by: operator:epiphytic
  - id: concept:deterministic-research-control
    label: Deterministic research control
    description: Non-model enforcement of acquisition, validation, policy, budgets, and commits.
    broader: [concept:persistent-research-knowledge]
    recorded_at: 2026-08-03T16:00:00Z
    recorded_by: operator:epiphytic
  - id: project:gpt-researcher
    label: GPT Researcher
    description: Open-source web and local deep-research agent.
    broader: [concept:report-first-research, concept:multi-agent-research]
    recorded_at: 2026-08-03T16:00:00Z
    recorded_by: operator:epiphytic
  - id: project:storm
    label: STORM and Co-STORM
    description: Knowledge-curation systems using multi-perspective questions and hierarchical outlines.
    broader: [concept:report-first-research, concept:multi-agent-research]
    recorded_at: 2026-08-03T16:00:00Z
    recorded_by: operator:epiphytic
  - id: project:langchain-open-deep-research
    label: LangChain Open Deep Research
    description: Configurable LangGraph deep-research agent and evaluation example.
    broader: [concept:report-first-research, concept:multi-agent-research]
    recorded_at: 2026-08-03T16:00:00Z
    recorded_by: operator:epiphytic
  - id: project:paperqa2
    label: PaperQA2
    description: Scientific-document question answering and retrieval system.
    broader: [concept:scientific-literature-agents]
    recorded_at: 2026-08-03T16:00:00Z
    recorded_by: operator:epiphytic
  - id: project:deerflow
    label: DeerFlow
    description: General super-agent harness with research ancestry and broad tools.
    broader: [concept:multi-agent-research]
    recorded_at: 2026-08-03T16:00:00Z
    recorded_by: operator:epiphytic
  - id: project:deepresearchagent
    label: Skywork DeepResearchAgent
    description: Self-evolution runtime with historical hierarchical research-agent positioning.
    broader: [concept:multi-agent-research, concept:persistent-research-knowledge]
    recorded_at: 2026-08-03T16:00:00Z
    recorded_by: operator:epiphytic
  - id: project:openresearcher
    label: OpenResearcher
    description: Open pipeline for research-agent trajectory synthesis, training, and evaluation.
    broader: [concept:scientific-literature-agents]
    recorded_at: 2026-08-03T16:00:00Z
    recorded_by: operator:epiphytic
  - id: project:epiphytic-research-agent
    label: Geas
    description: Persistent ontology-backed research control plane in this repository.
    broader: [concept:persistent-research-knowledge, concept:deterministic-research-control]
    recorded_at: 2026-08-03T16:00:00Z
    recorded_by: operator:epiphytic

evidence:
  - key: gptr-scope
    source_key: gpt-researcher
    exact: The official repository describes GPT Researcher as an open deep-research agent for web and local research.
  - key: gptr-architecture
    source_key: gpt-researcher
    exact: Its documented architecture separates a planner, parallel execution agents, source tracking, and a publisher that produces a research report.
  - key: gptr-recursion
    source_key: gpt-researcher
    exact: The project documents recursive tree-like exploration with configurable breadth and depth.
  - key: gptr-license
    source_key: gpt-researcher
    exact: The repository identifies its software license as Apache-2.0.
  - key: gptr-output
    source_key: gpt-researcher
    exact: The documented durable output is a cited report; this source card did not verify a maintained claim-level ontology.
  - key: storm-outline
    source_key: storm
    exact: STORM performs Internet research, creates a hierarchical outline, and generates a Wikipedia-like article with citations.
  - key: storm-questions
    source_key: storm
    exact: STORM uses perspective-guided questions and simulated conversations to broaden and deepen its research.
  - key: storm-mindmap
    source_key: storm
    exact: Co-STORM supports human participation and maintains a dynamically updated hierarchical mind map as a shared conceptual space.
  - key: storm-retrieval
    source_key: storm
    exact: The documented retrieval modules include web-search providers and VectorRM for user-provided documents.
  - key: storm-license
    source_key: storm
    exact: The repository identifies its software license as MIT.
  - key: storm-persistence-gap
    source_key: storm
    exact: The mind map is close to a reusable hierarchy, but this source card did not verify a versioned claim-and-evidence ontology that persists across research runs.
  - key: odr-scope
    source_key: langchain-odr
    exact: Open Deep Research is documented as a configurable open-source research agent supporting multiple model providers, search tools, and MCP servers.
  - key: odr-model-roles
    source_key: langchain-odr
    exact: Its documented model roles include search-result summarization, research, compression, and final-report generation.
  - key: odr-evaluation
    source_key: langchain-odr
    exact: The project publishes a Deep Research Bench evaluation workflow whose leaderboard metric uses an LLM judge against expert-created reference reports.
  - key: odr-output
    source_key: langchain-odr
    exact: The current implementation is report-oriented and the repository retains legacy plan-and-execute and supervisor-researcher implementations.
  - key: odr-license
    source_key: langchain-odr
    exact: The repository identifies its software license as MIT.
  - key: pqa-rag
    source_key: paperqa2
    exact: PaperQA2 is documented as retrieval-augmented generation over scientific documents with grounded answers and in-text citations.
  - key: pqa-pipeline
    source_key: paperqa2
    exact: It indexes local PDFs and other text-bearing formats, enriches metadata through scholarly services, chunks evidence, retrieves and ranks contexts, and generates an answer.
  - key: pqa-safety
    source_key: paperqa2
    exact: PaperQA2 documents contradiction detection and retraction checks as scientific-research capabilities.
  - key: pqa-state
    source_key: paperqa2
    exact: Its persistent local state includes document indexes and prior answers.
  - key: pqa-retrieval
    source_key: paperqa2
    exact: The default retrieval path uses embeddings, while sparse keyword retrieval and disabling evidence retrieval are documented alternatives.
  - key: pqa-license
    source_key: paperqa2
    exact: The repository identifies its software license as Apache-2.0.
  - key: deer-scope
    source_key: deerflow
    exact: DeerFlow 2.0 is documented as a general super-agent harness that grew from a deep-research framework.
  - key: deer-tools
    source_key: deerflow
    exact: It orchestrates sub-agents and provides memory, sandboxes, skills, web search, web fetch, file operations, shell execution, and MCP-extensible tools.
  - key: deer-agents
    source_key: deerflow
    exact: The project documents parallel scoped sub-agents and a lead-agent synthesis step for complex research.
  - key: deer-rewrite
    source_key: deerflow
    exact: The active 2.0 line is a ground-up rewrite; the original research framework remains on a 1.x branch.
  - key: deer-license
    source_key: deerflow
    exact: The repository identifies its software license as MIT.
  - key: deer-security
    source_key: deerflow
    exact: Its broad tool surface and configurable sandbox modes create a different security boundary from a fixed deterministic research control plane.
  - key: dra-old-scope
    source_key: deepresearchagent
    exact: The repository description presents DeepResearchAgent as a hierarchical multi-agent system with a top-level planner coordinating specialized agents.
  - key: dra-current-scope
    source_key: deepresearchagent
    exact: The current README presents DeepResearchAgent as a self-evolution protocol and runtime with versioned resources, auditable lineage, rollback, structured traces, and persistent memory.
  - key: dra-loop
    source_key: deepresearchagent
    exact: The current design separates a resource substrate from a proposal-assessment-commit evolution loop.
  - key: dra-license
    source_key: deepresearchagent
    exact: The repository identifies its software license as MIT.
  - key: dra-ambiguity
    source_key: deepresearchagent
    exact: The differing repository description and current README leave the primary present-day product scope ambiguous.
  - key: openr-scope
    source_key: openresearcher
    exact: OpenResearcher is documented as a fully open pipeline for long-horizon deep-research trajectory synthesis.
  - key: openr-assets
    source_key: openresearcher
    exact: The project publishes an agent model, data, training methodology, evaluation tooling, and evaluation logs.
  - key: openr-emphasis
    source_key: openresearcher
    exact: Its emphasis is reproducible research-agent training and evaluation rather than maintaining a topic ontology.
  - key: openr-license
    source_key: openresearcher
    exact: GitHub did not identify a repository license and no top-level license file was present in the inspected default-branch tree, so the software license is recorded as unknown.
  - key: ep-graph
    source_key: epiphytic
    exact: Geas treats a versioned graph of concepts, claims, exact evidence, disagreements, knowledge gaps, and source-threat observations as its durable product.
  - key: ep-canonical
    source_key: epiphytic
    exact: Canonical ontology and policy remain inspectable text, while immutable content-addressed records and blobs preserve research history.
  - key: ep-query
    source_key: epiphytic
    exact: SQLite is a disposable deterministic query projection with FTS, hierarchy traversal, provenance joins, temporal filters, citation references, and drift detection.
  - key: ep-security
    source_key: epiphytic
    exact: Retrieved source text and model output are treated as inert data; deterministic code controls validation, policy, workflow transitions, budgets, and commits.
  - key: ep-model
    source_key: epiphytic
    exact: The project prefers local DeepSeek for model-assisted proposals, but models do not receive ontology-write authority.
  - key: ep-license
    source_key: epiphytic
    exact: The repository identifies its software license as Apache-2.0, while the starter ontology has a CC0 declaration.


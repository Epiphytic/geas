controversies:
  - topic_concept_id: concept:open-source-research-agents
    question: Should the durable research product be a report or a reusable claim graph?
    description: Projects make different architectural choices about whether reports or persistent structured knowledge are primary.
    claim_keys: [gptr-output, ep-graph]
    status: open
  - topic_concept_id: concept:open-source-research-agents
    question: Should local research retrieval default to dense embeddings or deterministic structured and lexical queries?
    description: PaperQA2 documents embedding-first retrieval with alternatives; Epiphytic makes graph and lexical queries authoritative.
    claim_keys: [pqa-retrieval, ep-query]
    status: open
  - topic_concept_id: concept:open-source-research-agents
    question: How broad should an autonomous research agent's executable tool surface be?
    description: DeerFlow exposes a configurable general tool harness, while Epiphytic confines model output behind deterministic controls.
    claim_keys: [deer-security, ep-security]
    status: open
  - topic_concept_id: project:deepresearchagent
    question: What is the current primary scope of Skywork DeepResearchAgent?
    description: Repository metadata and the current README describe materially different primary identities.
    claim_keys: [dra-old-scope, dra-current-scope, dra-ambiguity]
    status: open
  - topic_concept_id: concept:persistent-research-knowledge
    question: Does a dynamic mind map provide the same maintenance guarantees as a versioned claim-and-evidence ontology?
    description: Co-STORM maintains a useful hierarchy, but persistence, evidence selectors, and cross-run versioning remain unverified here.
    claim_keys: [storm-mindmap, storm-persistence-gap, ep-graph]
    status: open

gaps:
  - topic_concept_id: concept:open-source-research-agents
    question: Which projects preserve claim-level evidence and ontology changes across independent research runs?
    kind: insufficient_evidence
    rationale: Most inspected documentation emphasizes reports, answers, indexes, traces, or memory rather than versioned claim graphs.
    related_claim_keys: [gptr-output, storm-persistence-gap, pqa-state, ep-graph]
    priority: 95
    freshness_deadline: 2026-09-03T00:00:00Z
  - topic_concept_id: concept:open-source-research-agents
    question: How do the projects resist indirect prompt injection at retrieval, parsing, tool, and commit boundaries?
    kind: missing_source_class
    rationale: README-level feature documentation is insufficient for a defensible security comparison; code and security advisories require review.
    related_claim_keys: [deer-tools, ep-security]
    priority: 95
    freshness_deadline: 2026-09-03T00:00:00Z
  - topic_concept_id: concept:open-source-research-agents
    question: Can the projects be compared on one independently reproduced benchmark with fixed model, search, corpus, and cost?
    kind: insufficient_evidence
    rationale: Published evaluations target different tasks and some use model-based judges, so current scores are not directly comparable.
    related_claim_keys: [odr-evaluation, openr-assets]
    priority: 90
    freshness_deadline: 2026-10-03T00:00:00Z
  - topic_concept_id: concept:persistent-research-knowledge
    question: What are Co-STORM mind-map persistence, export, versioning, and exact-evidence semantics?
    kind: unknown
    rationale: The hierarchy is highly relevant, but the inspected project overview does not establish equivalence to a persistent evidence graph.
    related_claim_keys: [storm-mindmap, storm-persistence-gap]
    priority: 88
    freshness_deadline: 2026-09-03T00:00:00Z
  - topic_concept_id: project:openresearcher
    question: Under what license may OpenResearcher code be used and redistributed?
    kind: insufficient_evidence
    rationale: GitHub license detection was empty and no top-level license file was present in the inspected default tree.
    related_claim_keys: [openr-license]
    priority: 85
    freshness_deadline: 2026-09-03T00:00:00Z
  - topic_concept_id: concept:open-source-research-agents
    question: Which citation and retraction relations can be resolved against authoritative metadata rather than text signals?
    kind: unknown
    rationale: Textual identifier extraction is deterministic, but work resolution and authoritative retraction status need connector-backed evidence.
    related_claim_keys: [pqa-safety, ep-query]
    priority: 80
    freshness_deadline: 2026-09-03T00:00:00Z
  - topic_concept_id: concept:open-source-research-agents
    question: Which projects can operate fully with local models and open retrieval services at documented quality levels?
    kind: insufficient_evidence
    rationale: Provider configurability does not establish comparable quality, cost, or privacy under local-only execution.
    related_claim_keys: [odr-scope, ep-model]

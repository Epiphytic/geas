version: 1

# These files define ontology meaning and controlled vocabulary. Generated
# Markdown, reports, and SQLite files are projections and are not canonical.
ontology_globs:
  - ontology/**/*.yaml
  - config/query-vocabulary.yaml
  - intelligence/sources.yaml

# Trusted policies affect ingestion, routing, and projection semantics.
operational_policy_paths:
  - config/source-policy.yaml
  - config/research-policy.yaml
  - config/deposit-policy.yaml
  - config/model-policy.yaml
  - config/budget-policy.yaml
  - config/workload-policy.yaml

# Pydantic is currently authoritative for operational record envelopes.
record_schema_paths:
  - src/research_agent/models.py
  - src/research_agent/discovery.py
  - src/research_agent/workflow.py
  - src/research_agent/policy.py
  - src/research_agent/planning.py
  - src/research_agent/operator_policy.py
  - src/research_agent/deposits.py
  - src/research_agent/model_policy.py
  - src/research_agent/budget.py
  - src/research_agent/approvals.py
  - src/research_agent/workload.py
  - src/research_agent/truth.py
  - src/research_agent/store.py

# These roots are relative to the selected immutable store root.
record_directory: records
blob_directory: blobs/sha256

database_to_canonical: forbidden
canonical_drift_action: create_snapshot_then_rebuild
projection_drift_action: discard_and_rebuild

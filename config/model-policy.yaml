version: 1

# Automatic external calls remain off until enforceable cost thresholds and a
# persistent usage ledger are accepted by the operator.
automatic_external_calls: false

# Unknown content must be classified before it can leave the deployment.
unknown_data_class_external: forbidden

external_providers:
  - provider: openai
    base_urls:
      - https://api.openai.com/v1
    models:
      - gpt-5.2
    operations:
      - model_smoke
      - query_compilation
      - ontology_extraction
      - ontology_design
      - conflict_analysis
      - gap_analysis
    data_classes:
      - public
      - authorized_workspace
      - licensed
      - private

  - provider: zai
    base_urls:
      - https://api.z.ai/api/paas/v4
    models:
      - glm-5.2
    operations:
      - model_smoke
      - query_compilation
      - ontology_extraction
      - ontology_design
      - conflict_analysis
      - gap_analysis
    data_classes:
      - public
      - authorized_workspace
      - licensed
      - private

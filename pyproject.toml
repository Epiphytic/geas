[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "epiphytic-research-agent"
version = "0.1.0"
description = "Deterministic control plane for an ontology-backed research knowledge system"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
  "coincurve>=21.0,<22",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
research-agent = "research_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/research_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

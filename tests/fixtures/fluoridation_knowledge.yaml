controversies:
  - topic_concept_id: concept:fluoridation-caries-effects
    question: How large is the contemporary caries-prevention benefit?
    description: >-
      Public-health guidance presents a substantial population benefit, while
      the contemporary Cochrane evidence characterizes the measured child
      benefit as small and uncertain.
    claim_keys: [cdc-benefit, cochrane-benefit]
    status: open
  - topic_concept_id: concept:fluoridation-neurodevelopment
    question: Do neurodevelopment findings at higher exposure apply at 0.7 mg/L?
    description: >-
      Higher-exposure associations motivate concern, but the cited review says
      evidence is insufficient for the U.S. fluoridation target.
    claim_keys: [ntp-high-exposure, ntp-target-unknown]
    status: open

gaps:
  - topic_concept_id: concept:fluoridation-caries-effects
    question: What happens to contemporary caries outcomes after fluoridation stops?
    kind: insufficient_evidence
    rationale: The 2024 review found insufficient eligible cessation evidence.
    related_claim_keys: [cochrane-benefit]
    priority: 70
    status: open
  - topic_concept_id: concept:fluoridation-neurodevelopment
    question: Does total fluoride exposure near a 0.7 mg/L water concentration affect child IQ?
    kind: insufficient_evidence
    rationale: >-
      Existing higher-exposure associations do not determine effects at the
      recommended U.S. community-water concentration.
    related_claim_keys: [ntp-high-exposure, ntp-target-unknown]
    priority: 90
    status: open
  - topic_concept_id: concept:fluoridation-regulation
    question: How will EPA's accelerated assessment change federal standards?
    kind: stale
    rationale: The assessment is in progress and requires a standing refresh.
    related_claim_keys: [epa-mcl, epa-reassessment]
    priority: 85
    status: investigating
    freshness_deadline: 2026-11-01T00:00:00Z

